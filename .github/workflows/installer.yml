name: Windows installer

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build installer
        shell: pwsh
        run: ./Installer/Inno/build-installer.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: TheAirlineProject-Setup
          path: artifacts/TheAirlineProject-Setup-*.exe
