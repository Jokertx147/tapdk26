name: Build

# Builds every push, so a mistake in the user interface code shows up here before anyone pulls it,
# and leaves ready-to-run downloads under the run's "Artifacts".

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  linux:
    name: Linux (Avalonia app + headless test)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # to put the screenshots on the ci-screenshots branch (the run's artifacts can't be fetched everywhere)
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build the game logic
        run: |
          dotnet build TheAirline.Core/TheAirline.Core.csproj -c Release
          dotnet build TheAirline.Presentation/TheAirline.Presentation.csproj -c Release

      - name: Build the Linux app (Avalonia)
        run: dotnet build TheAirline.Desktop/TheAirline.Desktop.csproj -c Release

      - name: Quick game test (new game, newest pages)
        run: |
          dotnet build TheAirline.Headless/TheAirline.Headless.csproj -c Release
          timeout 900 dotnet run --no-build -c Release --project TheAirline.Headless -- vm quick 2>&1 | tee quicktest.log
          grep -q "QUICK TEST OK" quicktest.log || { grep -m8 -iE "FAILED|timeout|exception|   at " quicktest.log | sed 's/^/::error::/'; exit 1; }

      - name: Scenario test (two scenarios from the main menu, a lost one, save and load)
        run: |
          TAP_SCEN="Jet,New Man" timeout 900 dotnet run --no-build -c Release --project TheAirline.Headless -- vm scenario 2>&1 | tee scenariotest.log
          grep -q "SCENARIO TEST OK" scenariotest.log || { grep -m8 -iE "FAILED|timeout|exception|   at " scenariotest.log | sed 's/^/::error::/'; exit 1; }

      - name: Game area test (an old save with the whole world, cleaned up from Options)
        run: |
          timeout 900 dotnet run --no-build -c Release --project TheAirline.Headless -- vm bloat 2>&1 | tee bloattest.log
          grep -q "BLOAT TEST OK" bloattest.log || { grep -m8 -iE "FAILED|timeout|exception|   at " bloattest.log | sed 's/^/::error::/'; exit 1; }

      - name: Replace aircraft test (one aircraft of a route replaced by another on the route screen)
        run: |
          timeout 900 dotnet run --no-build -c Release --project TheAirline.Headless -- vm replace 2>&1 | tee replacetest.log
          grep -q "REPLACE TEST OK" replacetest.log || { grep -m8 -iE "FAILED|timeout|exception|   at " replacetest.log | sed 's/^/::error::/'; exit 1; }

      - name: Fleet renewal test (every aircraft of one type replaced by another from the market)
        run: |
          timeout 900 dotnet run --no-build -c Release --project TheAirline.Headless -- vm renewal 2>&1 | tee renewaltest.log
          grep -q "RENEWAL TEST OK" renewaltest.log || { grep -m8 -iE "FAILED|timeout|exception|   at " renewaltest.log | sed 's/^/::error::/'; exit 1; }

      - name: Fleet renewal order test (a new aircraft ordered, saved and loaded, taking over on delivery)
        run: |
          timeout 900 dotnet run --no-build -c Release --project TheAirline.Headless -- vm renewalorder 2>&1 | tee renewalordertest.log
          grep -q "RENEWAL ORDER TEST OK" renewalordertest.log || { grep -m8 -iE "FAILED|timeout|exception|   at " renewalordertest.log | sed 's/^/::error::/'; exit 1; }

      - name: Runway test (an A350-900 against a runway extended to 2,800 m and 2,900 m)
        run: |
          timeout 900 dotnet run --no-build -c Release --project TheAirline.Headless -- vm runway 2>&1 | tee runwaytest.log
          grep -q "RUNWAY TEST OK" runwaytest.log || { grep -m8 -iE "FAILED|timeout|exception|   at " runwaytest.log | sed 's/^/::error::/'; exit 1; }

      - name: Route profit test (two routes flown for six weeks, then the report)
        run: |
          timeout 900 dotnet run --no-build -c Release --project TheAirline.Headless -- vm routeprofit 2>&1 | tee routeprofittest.log
          grep -q "ROUTE PROFIT TEST OK" routeprofittest.log || { grep -m8 -iE "FAILED|timeout|exception|   at " routeprofittest.log | sed 's/^/::error::/'; exit 1; }

      - name: Route forecast test (the planner's suggestion and forecast against a month of flying)
        run: |
          timeout 900 dotnet run --no-build -c Release --project TheAirline.Headless -- vm forecast 2>&1 | tee forecasttest.log
          grep -q "FORECAST TEST OK" forecasttest.log || { grep -m8 -iE "FAILED|timeout|exception|   at " forecasttest.log | sed 's/^/::error::/'; exit 1; }

      - name: Computer airlines test (destinations picked by forecast, losing routes given up)
        run: |
          timeout 900 dotnet run --no-build -c Release --project TheAirline.Headless -- vm aiplan 2>&1 | tee aiplantest.log
          grep -q "AI PLAN TEST OK" aiplantest.log || { grep -m8 -iE "FAILED|timeout|exception|   at " aiplantest.log | sed 's/^/::error::/'; exit 1; }

      - name: World map animation test (aircraft glide between reads of the game)
        run: |
          timeout 900 dotnet run --no-build -c Release --project TheAirline.Headless -- vm mapanim 2>&1 | tee mapanimtest.log
          grep -q "MAP ANIMATION TEST OK" mapanimtest.log || { grep -m8 -iE "FAILED|timeout|exception|   at " mapanimtest.log | sed 's/^/::error::/'; exit 1; }

      - name: Competitors test (rivals on my routes and airports, their moves, the screen)
        run: |
          timeout 900 dotnet run --no-build -c Release --project TheAirline.Headless -- vm competitors 2>&1 | tee competitorstest.log
          grep -q "COMPETITORS TEST OK" competitorstest.log || { grep -m8 -iE "FAILED|timeout|exception|   at " competitorstest.log | sed 's/^/::error::/'; exit 1; }

      - name: Rivals on the map test (one airline, those on my routes, everyone at an airport)
        run: |
          timeout 900 dotnet run --no-build -c Release --project TheAirline.Headless -- vm rivalmap 2>&1 | tee rivalmaptest.log
          grep -q "RIVAL MAP TEST OK" rivalmaptest.log || { grep -m8 -iE "FAILED|timeout|exception|   at " rivalmaptest.log | sed 's/^/::error::/'; exit 1; }

      - name: Connecting passengers test (the flight engine's quick sum equals the markets)
        run: |
          timeout 900 dotnet run --no-build -c Release --project TheAirline.Headless -- vm fastdemand 2>&1 | tee fastdemandtest.log
          grep -q "FAST DEMAND TEST OK" fastdemandtest.log || { grep -m8 -iE "FAILED|timeout|exception|   at " fastdemandtest.log | sed 's/^/::error::/'; exit 1; }

      - name: Round trip advice test (the forecast's extra round trip against a month flown with and without it)
        run: |
          TAP_SAMPLE=40 timeout 900 dotnet run --no-build -c Release --project TheAirline.Headless -- vm tripadvice 2>&1 | tee tripadvicetest.log
          grep -q "TRIP ADVICE TEST OK" tripadvicetest.log || { grep -m8 -iE "FAILED|timeout|exception|   at " tripadvicetest.log | sed 's/^/::error::/'; exit 1; }

      - name: Follow an aircraft on the map test
        run: |
          timeout 900 dotnet run --no-build -c Release --project TheAirline.Headless -- vm follow 2>&1 | tee followtest.log
          grep -q "FOLLOW TEST OK" followtest.log || { grep -m8 -iE "FAILED|timeout|exception|   at " followtest.log | sed 's/^/::error::/'; exit 1; }

      - name: Flight board test (a followed aircraft's flights through a day)
        run: |
          timeout 900 dotnet run --no-build -c Release --project TheAirline.Headless -- vm board 2>&1 | tee boardtest.log
          grep -q "FLIGHT BOARD TEST OK" boardtest.log || { grep -m8 -iE "FAILED|timeout|exception|   at " boardtest.log | sed 's/^/::error::/'; exit 1; }

      - name: Demand both ways test (a new game's airline airports get passengers towards them too)
        run: |
          timeout 900 dotnet run --no-build -c Release --project TheAirline.Headless -- vm onewaytest 2>&1 | tee onewaytest.log
          grep -q "DEMAND BOTH WAYS TEST OK" onewaytest.log || { grep -m8 -iE "FAILED|timeout|exception|   at " onewaytest.log | sed 's/^/::error::/'; exit 1; }

      - name: History test (rival moves and recorded flights come back with a saved game)
        run: |
          timeout 900 dotnet run --no-build -c Release --project TheAirline.Headless -- vm history 2>&1 | tee historytest.log
          grep -q "HISTORY TEST OK" historytest.log || { grep -m8 -iE "FAILED|timeout|exception|   at " historytest.log | sed 's/^/::error::/'; exit 1; }

      - name: Demand audit test (data figures, no gaps, the same after a load and a new year)
        run: |
          timeout 900 dotnet run --no-build -c Release --project TheAirline.Headless -- vm demandaudit 2>&1 | tee demandaudittest.log
          grep -q "DEMAND AUDIT TEST OK" demandaudittest.log || { grep -m8 -iE "FAILED|timeout|exception|   at " demandaudittest.log | sed 's/^/::error::/'; exit 1; }

      - name: Save size test (a smaller save shows the same figures, facilities and shares)
        run: |
          timeout 900 dotnet run --no-build -c Release --project TheAirline.Headless -- vm savesize 2>&1 | tee savesizetest.log
          grep -q "SAVE SIZE TEST OK" savesizetest.log || { grep -m8 -iE "FAILED|timeout|exception|   at " savesizetest.log | sed 's/^/::error::/'; exit 1; }

      - name: Rival alerts test
        run: |
          timeout 900 dotnet run --no-build -c Release --project TheAirline.Headless -- vm rivalalerts 2>&1 | tee rivalalerts.log
          grep -q "RIVAL ALERTS TEST OK" rivalalerts.log || { grep -m8 -iE "FAILED|timeout|exception|   at " rivalalerts.log | sed 's/^/::error::/'; exit 1; }

      - name: Monthly report test
        run: |
          timeout 900 dotnet run --no-build -c Release --project TheAirline.Headless -- vm report 2>&1 | tee reporttest.log
          grep -q "REPORT TEST OK" reporttest.log || { grep -m8 -iE "FAILED|timeout|exception|   at " reporttest.log | sed 's/^/::error::/'; exit 1; }

      - name: Route suggestions test
        run: |
          timeout 900 dotnet run --no-build -c Release --project TheAirline.Headless -- vm suggest 2>&1 | tee suggest.log
          grep -q "SUGGEST TEST OK" suggest.log || { grep -m8 -iE "FAILED|timeout|exception|   at " suggest.log | sed 's/^/::error::/'; exit 1; }

      - name: Order ahead test
        run: |
          TAP_YEAR=1994 timeout 900 dotnet run --no-build -c Release --project TheAirline.Headless -- vm orderahead 2>&1 | tee orderahead.log
          grep -q "ORDER AHEAD TEST OK" orderahead.log || { grep -m8 -iE "FAILED|timeout|exception|   at " orderahead.log | sed 's/^/::error::/'; exit 1; }

      - name: Engines test
        run: |
          TAP_YEAR=1996 timeout 900 dotnet run --no-build -c Release --project TheAirline.Headless -- vm engines 2>&1 | tee engines.log
          grep -q "ENGINES TEST OK" engines.log || { grep -m8 -iE "FAILED|timeout|exception|   at " engines.log | sed 's/^/::error::/'; exit 1; }

      - name: Statistics test
        run: |
          timeout 900 dotnet run --no-build -c Release --project TheAirline.Headless -- vm stats 2>&1 | tee statstest.log
          grep -q "STATS TEST OK" statstest.log || { grep -m8 -iE "FAILED|timeout|exception|   at " statstest.log | sed 's/^/::error::/'; exit 1; }

      - name: Reputation forecast test
        run: |
          timeout 900 dotnet run --no-build -c Release --project TheAirline.Headless -- vm reputation 2>&1 | tee reputation.log
          grep -q "REPUTATION TEST OK" reputation.log || { grep -m8 -iE "FAILED|timeout|exception|   at " reputation.log | sed 's/^/::error::/'; exit 1; }

      - name: Statistics screen test
        run: |
          timeout 900 dotnet run --no-build -c Release --project TheAirline.Headless -- vm statistics 2>&1 | tee statisticsscreen.log
          grep -q "STATISTICS TEST OK" statisticsscreen.log || { grep -m8 -iE "FAILED|timeout|exception|   at " statisticsscreen.log | sed 's/^/::error::/'; exit 1; }

      - name: Airport search test
        run: |
          timeout 900 dotnet run --no-build -c Release --project TheAirline.Headless -- vm airportsearch 2>&1 | tee airportsearch.log
          grep -q "AIRPORT SEARCH TEST OK" airportsearch.log || { grep -m8 -iE "FAILED|timeout|exception|   at " airportsearch.log | sed 's/^/::error::/'; exit 1; }

      - name: Airport sort test
        run: |
          timeout 900 dotnet run --no-build -c Release --project TheAirline.Headless -- vm airportsort 2>&1 | tee airportsort.log
          grep -q "AIRPORT SORT TEST OK" airportsort.log || { grep -m8 -iE "FAILED|timeout|exception|   at " airportsort.log | sed 's/^/::error::/'; exit 1; }

      - name: Empty route test
        run: |
          timeout 900 dotnet run --no-build -c Release --project TheAirline.Headless -- vm aiempty 2>&1 | tee aiempty.log
          grep -q "EMPTY ROUTE TEST OK" aiempty.log || { grep -m8 -iE "FAILED|timeout|exception|   at " aiempty.log | sed 's/^/::error::/'; exit 1; }

      - name: Fast-forward test (a day, a week, next month, stopped by Pause and by low cash)
        run: |
          timeout 900 dotnet run --no-build -c Release --project TheAirline.Headless -- vm skip 2>&1 | tee skiptest.log
          grep -q "SKIP TEST OK" skiptest.log || { grep -m8 -iE "FAILED|timeout|exception|   at " skiptest.log | sed 's/^/::error::/'; exit 1; }

      - name: Screenshot mode (the newer screens drawn under a virtual display)
        run: |
          sudo apt-get install -y -qq xvfb > /dev/null
          xvfb-run -a -s "-screen 0 1600x1000x24" timeout 900 dotnet run --no-build -c Release --project TheAirline.Desktop -- --screenshots shots || true
          cat shots/progress.txt || true
          grep -q " done$" shots/progress.txt || { (cat shots/error.txt 2>/dev/null || echo "no screenshots were made") | head -12 | sed 's/^/::error::/'; exit 1; }
          ls -la shots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-linux
          path: shots
          if-no-files-found: ignore

      # also on an orphan branch, force-pushed, so the pictures can be looked at with a plain git fetch
      - name: Put the screenshots on the ci-screenshots branch
        if: github.ref == 'refs/heads/sdk-style-conversion'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf /tmp/shots && cp -r shots /tmp/shots
          git checkout --orphan ci-screenshots
          git rm -rf --cached . > /dev/null
          rm -rf shots
          mkdir -p shots && cp /tmp/shots/* shots/
          echo "The Avalonia app's newer screens, drawn by CI under a virtual display at every push to" > README.md
          echo "sdk-style-conversion. Replaced each time; not part of the game's history." >> README.md
          echo "From commit ${GITHUB_SHA}." >> README.md
          git add -A shots README.md
          git commit -q -m "Screenshots from ${GITHUB_SHA}"
          git push -q --force origin ci-screenshots

      - name: Publish a ready-to-run Linux build
        run: |
          dotnet publish TheAirline.Desktop/TheAirline.Desktop.csproj -c Release -r linux-x64 --self-contained true -o publish/TheAirline
          rsync -a --exclude 'saves' Data/Data/ publish/TheAirline/data/
          chmod +x publish/TheAirline/TheAirline.Desktop
          cat > publish/TheAirline/start.sh <<'EOF'
          #!/bin/sh
          cd "$(dirname "$0")" && exec ./TheAirline.Desktop "$@"
          EOF
          chmod +x publish/TheAirline/start.sh
          tar -czf TheAirline-Linux-x64.tar.gz -C publish TheAirline

      - uses: actions/upload-artifact@v4
        with:
          name: TheAirline-Linux-x64
          path: TheAirline-Linux-x64.tar.gz
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quick-test-log
          path: quicktest.log
          if-no-files-found: ignore
          retention-days: 14

  windows:
    name: Windows (WPF app + Avalonia app)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build the Windows app (WPF)
        run: dotnet build TheAirline/TheAirline.csproj -c Release

      - name: Publish the Avalonia app for Windows
        shell: pwsh
        run: |
          dotnet publish TheAirline.Desktop/TheAirline.Desktop.csproj -c Release -r win-x64 --self-contained true -o publish/TheAirline
          robocopy Data/Data publish/TheAirline/data /E /XD saves /NFL /NDL /NJH /NJS
          if ($LASTEXITCODE -ge 8) { exit $LASTEXITCODE } else { exit 0 }

      - uses: actions/upload-artifact@v4
        with:
          name: TheAirline-Avalonia-Windows-x64
          path: publish/TheAirline
          retention-days: 14
